services:
  mysql:
    image: mysql:8.4
    container_name: notifyhub-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: notifyhub
      MYSQL_USER: notifyhub
      MYSQL_PASSWORD: notifyhub
    ports:
      - "3307:3306"   # 3307 on your machine, so it won't clash with a local MySQL
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      retries: 5

volumes:
  mysql_data: