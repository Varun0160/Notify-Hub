name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read            # least privilege: this workflow can read code and nothing else

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true  # a newer push makes the older run pointless

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '27'
          cache: maven

      # Unit tests plus the Testcontainers integration tests (Docker is preinstalled on the runner)
      - name: Build and test
        run: ./mvnw -B verify

      - name: Keep test reports when something fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports

  docker:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Start the whole stack from the Dockerfile
        run: |
          cp .env.example .env
          docker compose --profile app up -d --build --wait --wait-timeout 240

      - name: Smoke test
        run: |
          curl -fsS http://localhost:8080/actuator/health
          curl -fsS http://localhost:8080/api/v1/ping

      - name: Show logs when something fails
        if: failure()
        run: docker compose --profile app logs --no-color

      - name: Clean up
        if: always()
        run: docker compose --profile app down -v