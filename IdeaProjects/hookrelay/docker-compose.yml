services:
  mysql:
    image: mysql:8.4
    container_name: hookrelay-mysql
    environment:
      MYSQL_DATABASE: hookrelay
      MYSQL_USER: hookrelay
      MYSQL_PASSWORD: hookrelay
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
volumes:
  mysql_data: