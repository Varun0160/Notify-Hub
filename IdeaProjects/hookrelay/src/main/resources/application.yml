spring:
  application:
    name: hookrelay
  datasource:
#    url: jdbc:mysql://localhost:3306/hookrelay?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    url: jdbc:mysql://localhost:3307/hookrelay?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: hookrelay

    password: hookrelay
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    jpa:
      hibernate:
        ddl-auto: validate
      open-in-view: false
      properties:
        hibernate:
          jdbc:
            time_zone: UTC

management:
  endpoints:
    web:
      exposure:
        include: health,info

hookrelay:
  security:
    jwt-secret: ${JWT_SECRET:dev-only-secret-change-me-in-production-32chars-min}
    jwt-expiry-minutes: 60


