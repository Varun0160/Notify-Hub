spring:
  application:
    name: notifyhub
  datasource:
    url: jdbc:mysql://localhost:3307/notifyhub
    username: ${DB_USER:notifyhub}
    password: ${DB_PASSWORD:notifyhub}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  rabbitmq:
    host: localhost
    port: 5672
    username: ${RABBIT_USER:notifyhub}
    password: ${RABBIT_PASSWORD:notifyhub}
    connection-timeout: 3s
    publisher-confirm-type: simple
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 5
        concurrency: 2
        max-concurrency: 4

management:
  endpoints:
    web:
      exposure:
        include: health,info

server:
  port: 8080


notifyhub:
  worker:
    simulated-delay-ms: 0
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-at-least-32-bytes-long!!}
    issuer: notifyhub
    access-ttl-minutes: 15
    refresh-ttl-days: 7
  bootstrap-admin:
    email: ${ADMIN_EMAIL:admin@notifyhub.local}
    password: ${ADMIN_PASSWORD:Admin@12345}
  sweeper:
    interval-ms: 10000
    min-age-seconds: 15

  providers:
      email: mock            # mock | sendgrid
      sendgrid:
        api-key: ${SENDGRID_API_KEY:}
        from-email: ${SENDGRID_FROM_EMAIL:}
        base-url: https://api.sendgrid.com
        connect-timeout-ms: 3000
        read-timeout-ms: 5000

  retry:
    max-attempts: 5
    base-delay-seconds: 10
    max-delay-seconds: 3600
  reaper:
    interval-ms: 30000
    stale-after-seconds: 120